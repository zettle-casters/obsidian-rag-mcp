services:
  # Neo4j - граф связей между заметками
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/test1234
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Qdrant - векторная БД для семантического поиска
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Obsidian RAG MCP Server + Agent
  obsidian-rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Agent API
      - "8001:8001"  # MCP HTTP Server
    environment:
      # Neo4j connection
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test1234

      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_CHEAP_MODEL=${OPENAI_CHEAP_MODEL:-gpt-4o-mini}

      # Agent configuration
      - MAX_RECURSION_DEPTH=${MAX_RECURSION_DEPTH:-3}
      - SEARCH_TOP_K=${SEARCH_TOP_K:-5}

      # Embeddings
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-openai/text-embedding-3-large}
    volumes:
      - vaults_metadata:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # Web UI
  obsidian-rag-ui:
    build:
      context: ./obsidian-rag-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Web UI
    depends_on:
      - obsidian-rag

volumes:
  neo4j_data:
  qdrant_data:
  vaults_metadata:
