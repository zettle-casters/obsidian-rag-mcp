[project]
name = "obsidian-rag-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "obsidian-parser",
    "obsidian-retriever",
    "obsidian-rag-api"
]

[project.scripts]
obsidian-mcp = "obsidian_rag_api.server:main"
obsidian-agent = "obsidian_rag_api.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_rag_mcp"]

[tool.uv.workspace]
members = [
    "obsidian-parser",
    "ObsidianRetriever",
    "obsidian-rag-api"
]

[tool.uv.sources]
obsidian-parser = { workspace = true, editable = true }
obsidian-retriever = { workspace = true, editable = true }
obsidian-rag-api = { workspace = true, editable = true }
